# Netlify build of the browser edition (Blazor WebAssembly PWA).
# The build image has no .NET SDK: install the one pinned by global.json, then publish.
[build]
  command = """
    curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh && \
    bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet" && \
    "$HOME/.dotnet/dotnet" publish src/Studio.Web/Studio.Web.csproj -c Release -o artifacts/web
  """
  publish = "artifacts/web/wwwroot"

[build.environment]
  DOTNET_CLI_TELEMETRY_OPTOUT = "1"
  DOTNET_NOLOGO = "1"
