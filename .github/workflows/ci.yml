name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  test:
    name: Build & tests (libraries, CLI, web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install ffmpeg (audio conversion tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Restore
        run: dotnet restore tests/Studio.Tests/Studio.Tests.csproj && dotnet restore src/Studio.Web/Studio.Web.csproj && dotnet restore src/Studio.Cli/Studio.Cli.csproj
      - name: Build
        run: |
          dotnet build tests/Studio.Tests/Studio.Tests.csproj -c Release --no-restore
          dotnet build src/Studio.Cli/Studio.Cli.csproj -c Release --no-restore
          dotnet build src/Studio.Web/Studio.Web.csproj -c Release --no-restore
      - name: Test
        run: dotnet test --project tests/Studio.Tests/Studio.Tests.csproj -c Release --no-build -- --coverage --coverage-output-format cobertura --results-directory ${{ github.workspace }}/TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  android:
    name: Android app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Install Android dependencies
        run: dotnet build src/Studio.App/Studio.App.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
      - name: Build APK
        run: dotnet publish src/Studio.App/Studio.App.csproj -f net10.0-android -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -o artifacts/android
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: artifacts/android/*-Signed.apk
          if-no-files-found: error

  windows:
    name: Windows app
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Publish
        run: dotnet publish src/Studio.App/Studio.App.csproj -f net10.0-windows10.0.19041.0 -c Release -p:RuntimeIdentifierOverride=win-x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None -o artifacts/windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows-app
          path: artifacts/windows
          if-no-files-found: error
